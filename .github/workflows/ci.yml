name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: No internal / AI-assistant / planning artifacts
        run: |
          echo "Scanning for files that must never be published..."
          matches=$(git ls-files | grep -E \
            '(^|/)(CLAUDE|AGENTS|GEMINI)\.md$|(^|/)(\.planning|\.serena|\.codegraph|claudedocs)(/|$)|(^|/)\.mcp\.json$|(^|/)[^/]*-PLAN\.md$|(^|/)(CONTENT-MAP|CORRECTION-BACKLOG|STYLE-CONTRACT|SANITIZATION-CHECKLIST)\.md$|^docs/internal/' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Internal or AI-assistant artifacts must not be committed:"
            echo "$matches"
            exit 1
          fi
          echo "OK — none found."

      - name: No authorship trailers or absolute developer paths
        run: |
          # Patterns are split so this workflow file does not match itself.
          fail=0
          if grep -rIn --exclude-dir=.git "Co-Authored""-By" . 2>/dev/null; then
            echo "::error::Remove Co-Authored""-By trailers."; fail=1
          fi
          if grep -rIn --exclude-dir=.git "/Use""rs/" . 2>/dev/null; then
            echo "::error::Remove absolute developer paths."; fail=1
          fi
          exit $fail

      - name: No internal identifiers or private environment references
        run: |
          # Character classes keep the expressions from matching their own definitions.
          matches=$(git grep -n -I -E \
            '(W[P]-[0-9]+|DOC-[P][0-9]+|PLAN[_]ONLY|IMPLEMENTATION[_]NOT[_]STARTED|code[x]/|/Use[r]s/|llbig[w]-[0-9]+|loxilb[-]app)' \
            -- . || true)
          if [ -n "$matches" ]; then
            echo "::error::Public files contain internal identifiers or private environment references:"
            echo "$matches"
            exit 1
          fi
          echo "OK — public content contains no blocked internal references."

  build:
    name: Strict docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict

  examples:
    name: Usage example contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate documented commands and payloads
        run: python tools/validate_examples.py
      - name: Verify every public example is classified
        run: python tools/refresh_example_inventory.py --check
      - name: Run validator mutation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --no-progress './docs/**/*.md' './snippets/**/*.md' './*.md'
          fail: true
