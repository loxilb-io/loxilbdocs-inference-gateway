name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: No internal / AI-assistant / planning artifacts
        run: |
          echo "Scanning for files that must never be published..."
          matches=$(find . -path ./.git -prune -o \
            \( -iname 'CLAUDE.md' -o -iname 'AGENTS.md' -o -iname 'GEMINI.md' \
               -o -iname '*-PLAN.md' -o -iname 'CONTENT-MAP.md' \
               -o -iname 'CORRECTION-BACKLOG.md' -o -iname 'STYLE-CONTRACT.md' \
               -o -iname 'SANITIZATION-CHECKLIST.md' -o -name '.planning' \
               -o -name '.serena' -o -name '.mcp.json' -o -name '.codegraph' \
               -o -name 'claudedocs' \) -print)
          if [ -n "$matches" ]; then
            echo "::error::Internal or AI-assistant artifacts must not be committed:"
            echo "$matches"
            exit 1
          fi
          echo "OK — none found."

      - name: No authorship trailers or absolute developer paths
        run: |
          # Patterns are split so this workflow file does not match itself.
          fail=0
          if grep -rIn --exclude-dir=.git "Co-Authored""-By" . 2>/dev/null; then
            echo "::error::Remove Co-Authored""-By trailers."; fail=1
          fi
          if grep -rIn --exclude-dir=.git "/Use""rs/" . 2>/dev/null; then
            echo "::error::Remove absolute developer paths."; fail=1
          fi
          exit $fail

  build:
    name: Strict docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --no-progress './docs/**/*.md' './*.md'
          fail: true
