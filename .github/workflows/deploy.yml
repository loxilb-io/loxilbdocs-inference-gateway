name: deploy

# Publishes the documentation to GitHub Pages with mike-based versioning.
#   - push to main            -> updates the "latest" alias
#   - tag  vX.Y.Z             -> publishes that version and repoints "latest"
# Enable GitHub Pages (Settings -> Pages -> Deploy from branch -> gh-pages)
# before the first run.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish (main -> latest)
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push --update-aliases latest

      - name: Publish (tag -> version + latest)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
