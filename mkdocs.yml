site_name: LoxiLB Inference Gateway
site_description: >-
  Documentation for the LoxiLB Inference Gateway — an inference-aware L4/L7
  load balancer for vLLM, SGLang, TensorRT-LLM, and llama.cpp serving fleets,
  with engine-aware routing, traffic governance, and secure operations guidance.
site_url: https://loxilb-io.github.io/loxilbdocs-inference-gateway/
repo_url: https://github.com/loxilb-io/loxilb-inference-gateway
repo_name: loxilb-io/loxilb-inference-gateway
edit_uri: ""

# Never publish local-only planning or instruction files, even at unlisted URLs.
exclude_docs: |
  internal/
  **/CLAUDE.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en
  - autorefs

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Choose an Inference Engine: getting-started/choose-your-engine.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Running Modes: concepts/running-modes.md
      - LB Algorithms: concepts/lb-algorithms.md
      - AI Routing Model: concepts/ai-routing-model.md
      - Engine Capability Matrix: concepts/engine-capability-matrix.md
  - AI Gateway:
      - Overview: ai-gateway/overview.md
      - Model Load Balancing: ai-gateway/model-load-balancing.md
      - LLM Routing: ai-gateway/llm-routing.md
      - KV-Cache Routing: ai-gateway/kv-caching.md
      - P/D Disaggregation: ai-gateway/pd-disaggregation.md
      - vLLM Integration: ai-gateway/vllm-integration.md
      - SGLang P/D Integration: ai-gateway/sglang-pd-disaggregation.md
      - TensorRT-LLM Integration: ai-gateway/tensorrt-llm-integration.md
      - llama.cpp Integration: ai-gateway/llamacpp-integration.md
      - AI Traffic Governance: ai-gateway/ai-traffic-governance.md
      - SSE & Quota: ai-gateway/sse-quota-management.md
      - API Key Management: ai-gateway/api-key-management.md
      - MCP Gateway: ai-gateway/mcp-gateway.md
      - Configuration Reference: ai-gateway/configuration-reference.md
  - LLM Integration Use-Cases:
      - KV-Cache-Aware Routing: use-cases/kv-cache-aware-routing.md
      - Routing Hierarchy: use-cases/routing-hierarchy.md
      - Configuration & Tuning: use-cases/configuration-tuning.md
      - SGLang Routing: use-cases/sglang-routing.md
      - vLLM vs SGLang: use-cases/vllm-vs-sglang.md
      - SGLang Config & Tuning: use-cases/sglang-configuration-tuning.md
      - Deploy P/D Disaggregation: use-cases/deploy-pd-disaggregation.md
      - Performance Methodology: use-cases/performance-methodology.md
  - Security:
