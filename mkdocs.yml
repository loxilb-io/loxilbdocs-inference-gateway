site_name: LoxiLB Inference Gateway
site_description: >-
  Documentation for the LoxiLB Inference Gateway — an inference-aware L4/L7
  load balancer for vLLM, SGLang, TensorRT-LLM, and llama.cpp serving fleets,
  with engine-aware routing, traffic governance, and secure operations guidance.
site_url: https://loxilb-io.github.io/loxilbdocs-inference-gateway/
repo_url: https://github.com/loxilb-io/loxilb-inference-gateway
repo_name: loxilb-io/loxilb-inference-gateway
edit_uri: ""

# Never publish local-only planning or instruction files, even at unlisted URLs.
exclude_docs: |
  internal/
  **/CLAUDE.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en
  - autorefs

extra:
  version:
    provider: mike
    default: latest

