      - Application & L4 Tracing: operations/tracing.md
      - DPU Offload Observability: operations/dpu-offload.md
      - Monitoring & Metrics: operations/monitoring.md
      - Grafana Dashboards: operations/observability-metrics-grafana.md
      - AI Quotas & QoS: operations/ai-qos.md
      - Log API Operations: operations/log-api.md
