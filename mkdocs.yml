site_name: LoxiLB Inference Gateway
site_description: >-
  Documentation for the LoxiLB Inference Gateway — an inference-aware L4/L7
  load balancer for LLM serving fleets (vLLM, SGLang) with KV-cache-aware
  routing, prefill/decode disaggregation, and OpenAI-compatible SSE streaming.
site_url: https://loxilb-io.github.io/loxilbdocs-inference-gateway/
repo_url: https://github.com/loxilb-io/loxilb-inference-gateway
repo_name: loxilb-io/loxilb-inference-gateway
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en
  - autorefs
  - tags

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Running Modes: concepts/running-modes.md
      - LB Algorithms: concepts/lb-algorithms.md
      - AI Routing Model: concepts/ai-routing-model.md
  - AI Gateway:
      - Overview: ai-gateway/overview.md
      - Model Load Balancing: ai-gateway/model-load-balancing.md
      - LLM Routing: ai-gateway/llm-routing.md
      - KV-Cache Routing: ai-gateway/kv-caching.md
      - P/D Disaggregation: ai-gateway/pd-disaggregation.md
      - vLLM Integration: ai-gateway/vllm-integration.md
      - SSE & Quota: ai-gateway/sse-quota-management.md
      - API Key Management: ai-gateway/api-key-management.md
      - MCP Gateway: ai-gateway/mcp-gateway.md
      - Configuration Reference: ai-gateway/configuration-reference.md
  - LLM Integration Use-Cases:
      - KV-Cache-Aware Routing: use-cases/kv-cache-aware-routing.md
      - Routing Hierarchy: use-cases/routing-hierarchy.md
      - Configuration & Tuning: use-cases/configuration-tuning.md
      - SGLang Routing: use-cases/sglang-routing.md
      - vLLM vs SGLang: use-cases/vllm-vs-sglang.md
      - SGLang Config & Tuning: use-cases/sglang-configuration-tuning.md
      - Deploy P/D Disaggregation: use-cases/deploy-pd-disaggregation.md
      - Performance Methodology: use-cases/performance-methodology.md
  - Security:
      - OPA L4 Policy: security/opa-l4.md
      - mTLS for AI Backends: security/mtls.md
  - Operations:
      - Monitoring & Metrics: operations/monitoring.md
      - Grafana Dashboards: operations/observability-metrics-grafana.md
      - Troubleshooting: operations/troubleshooting.md
      - Logging & Audit: operations/audit-log.md
  - Reference:
      - API (swagger): reference/api.md
      - swagger-extras (raw): reference/swagger-extras.md
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - System Requirements: reference/system-requirements.md
  - Community:
      - Contributing: community/contributing.md
      - Roadmap: community/roadmap.md
      - FAQ: community/faq.md
