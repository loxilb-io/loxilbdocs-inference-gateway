spec:
  progressDeadlineSeconds: 600
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      llm-d.ai/role: aggregated
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        llm-d.ai/engine-type: vllm
        llm-d.ai/guide: pd-disaggregation
        llm-d.ai/inference-serving: "true"
        llm-d.ai/model: Qwen3-32B-FP8
        llm-d.ai/role: aggregated
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                llm-d.ai/role: aggregated
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - Qwen/Qwen3-32B-FP8
        - --port=8000
        - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
        - --tensor-parallel-size=1
        - --block-size=16
        - --prefix-caching-hash-algo=sha256_cbor
        - --kv-events-config
        - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557"}'
        command:
        - vllm
        - serve
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: llm-d-hf-token
        - name: PYTHONHASHSEED
          value: "0"
        - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
          value: "1"
        - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
          value: "120"
        image: docker.io/vllm/vllm-openai:v0.30.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: modelserver
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: modelserver
        ports:
        - containerPort: 8000
          name: modelserver
          protocol: TCP
        - containerPort: 5557
          name: kv-events
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /v1/models
            port: modelserver
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "8"
            memory: 64Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
        startupProbe:
          failureThreshold: 120
          httpGet:
            path: /v1/models
            port: modelserver
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
        - mountPath: /.cache
          name: torch-compile-cache
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: pd-disaggregation-nvidia-gpu-vllm-sa
      serviceAccountName: pd-disaggregation-nvidia-gpu-vllm-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 16Gi
        name: shm
      - emptyDir: {}
        name: torch-compile-cache
