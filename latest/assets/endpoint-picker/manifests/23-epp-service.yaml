apiVersion: v1
kind: Service
metadata:
  name: pd-disaggregation-epp
  namespace: llm-d-pd-disaggregation
  labels:
    app.kubernetes.io/name: pd-disaggregation-epp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pd-disaggregation-epp
  ports:
  - name: grpc
    port: 9002
    targetPort: 9002
    protocol: TCP
  - name: grpc-health
    port: 9003
    targetPort: 9003
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
