<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="chart-title" aria-label="Line chart of p95 time to first token in seconds versus concurrency (1 to 64 streams) for EPP, loxilb-igw CHWBL and loxilb-igw RR. EPP and CHWBL stay near 1 to 3 seconds up to 32 streams and reach about 7.5 seconds at 64; RR rises steeply to 8.6 seconds at 32 and 14.9 seconds at 64." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
