<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="chart-title" aria-label="Line chart of throughput in requests per second versus concurrency (1 to 64 streams) for EPP, loxilb-igw CHWBL and loxilb-igw RR. EPP and CHWBL scale to about 17 to 18 requests per second at 64 streams; RR peaks at 4.8 at 16 streams and falls to 3.8." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
