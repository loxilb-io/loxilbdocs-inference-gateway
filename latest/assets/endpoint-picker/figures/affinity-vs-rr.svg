<rect x="340" y="284" width="14" height="20" rx="2" fill="#2a78d6"/>
<rect x="358" y="285" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
<rect x="375" y="285" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
