<text x="442" y="298" font-size="11" fill="#52514e" text-anchor="end">3 new</text>
<line x1="24" y1="334" x2="736" y2="334" stroke="#e6e5e1" stroke-width="1"/>
<text x="24" y="352" font-size="12" font-weight="600" fill="#0b0b0b">Prefilled over four turns: 9 of 10 blocks</text>
<text x="24" y="369" font-size="12" fill="#52514e">Pods B and C receive the conversation cold; pod A holds only block 1 when turn 4 returns.</text>
<text x="24" y="385" font-size="12" fill="#52514e">Measured on 15-turn conversations: 61% reuse, warm TTFT p50 2.7 s.</text>
<text x="24" y="408" font-size="13" font-weight="600" fill="#0b0b0b">Affinity (EPP or consistent hash): every turn lands on pod A</text>
