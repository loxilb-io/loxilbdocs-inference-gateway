<path d="M464,206 L457,202 L457,210 Z" fill="#c9c8c3"/>
<text x="340" y="201" font-size="11" fill="#52514e" text-anchor="middle">to Pod B</text>
<rect x="481" y="197" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
<rect x="498" y="197" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
<text x="582" y="210" font-size="11" fill="#52514e" text-anchor="end">2 new</text>
<text x="24" y="254" font-size="12" fill="#0b0b0b">Turn 3</text>
<text x="76" y="254" font-size="12" fill="#52514e">prompt = blocks 1–3</text>
