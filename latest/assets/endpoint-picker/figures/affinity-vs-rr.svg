<path d="M604,250 L597,246 L597,254 Z" fill="#c9c8c3"/>
<text x="410" y="245" font-size="11" fill="#52514e" text-anchor="middle">to Pod C</text>
<rect x="621" y="241" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
<rect x="638" y="241" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
<rect x="655" y="241" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
<text x="722" y="254" font-size="11" fill="#52514e" text-anchor="end">3 new</text>
<text x="24" y="298" font-size="12" fill="#0b0b0b">Turn 4</text>
<text x="76" y="298" font-size="12" fill="#52514e">prompt = blocks 1–4</text>
<line x1="210" y1="294" x2="324" y2="294" stroke="#c9c8c3" stroke-width="1.5"/>
