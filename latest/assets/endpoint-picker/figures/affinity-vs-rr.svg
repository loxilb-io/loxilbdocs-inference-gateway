<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-label="Schematic of prefix-cache reuse under round robin versus affinity routing. One conversation, four turns; each turn&#x27;s prompt is the previous blocks plus one new block. Under round robin the turns land on pods A, B, C, A, so the receiving pod rarely holds the prefix and 9 of 10 blocks are prefilled. Under affinity every turn lands on pod A, which already holds the prefix, so only the 4 new blocks are prefilled." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Schematic of prefix-cache reuse under round robin versus affinity routing. One conversation, four turns; each turn&#x27;s prompt is the previous blocks plus one new block. Under round robin the turns land on pods A, B, C, A, so the receiving pod rarely holds the prefix and 9 of 10 blocks are prefilled. Under affinity every turn lands on pod A, which already holds the prefix, so only the 4 new blocks are prefilled.</title><rect width="760" height="690" fill="#fcfcfb"/>
<text x="24" y="28" font-size="15" font-weight="600" fill="#0b0b0b">Where a turn lands decides how much of its prompt is recomputed</text>
<text x="24" y="47" font-size="12" fill="#52514e">One conversation, four turns. Each turn resends the whole conversation: the earlier blocks plus one new block.</text>
<text x="24" y="63" font-size="12" fill="#52514e">Schematic with one KV block per turn; the measured figures use 16-token blocks and 15 turns.</text>
<rect x="24" y="79" width="14" height="14" rx="2" fill="#2a78d6"/><text x="44" y="91" font-size="12" fill="#0b0b0b">block reused from this pod's KV cache</text>
<rect x="312" y="79" width="14" height="14" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/><text x="332" y="91" font-size="12" fill="#0b0b0b">block prefilled (computed again)</text>
<text x="24" y="122" font-size="13" font-weight="600" fill="#0b0b0b">Round robin: turns rotate across pods (A, B, C, A)</text>
<rect x="330" y="132" width="120" height="184" rx="4" fill="#f1f0ec"/>
<text x="390" y="146" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">Pod A</text>
<rect x="470" y="132" width="120" height="184" rx="4" fill="#f1f0ec"/>
<text x="530" y="146" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">Pod B</text>
<rect x="610" y="132" width="120" height="184" rx="4" fill="#f1f0ec"/>
<text x="670" y="146" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">Pod C</text>
<text x="24" y="166" font-size="12" fill="#0b0b0b">Turn 1</text>
<text x="76" y="166" font-size="12" fill="#52514e">prompt = block 1</text>
<line x1="210" y1="162" x2="324" y2="162" stroke="#c9c8c3" stroke-width="1.5"/>
<path d="M324,162 L317,158 L317,166 Z" fill="#c9c8c3"/>
<text x="270" y="157" font-size="11" fill="#52514e" text-anchor="middle">to Pod A</text>
<rect x="341" y="153" width="12" height="18" rx="2" fill="none" stroke="#eb6834" stroke-width="2"/>
<text x="442" y="166" font-size="11" fill="#52514e" text-anchor="end">1 new</text>
<text x="24" y="210" font-size="12" fill="#0b0b0b">Turn 2</text>
<text x="76" y="210" font-size="12" fill="#52514e">prompt = blocks 1–2</text>
