# Gitleaks configuration for loxilbdocs-inference-gateway.
# Extends the default gitleaks ruleset and allowlists documentation placeholders.
# Ignored paths are intentionally not allowlisted: if an internal file is ever
# force-added, the secret scan must still inspect it.
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholder values"
regexes = [
  '''<[A-Za-z0-9_-]+>''',   # angle-bracket placeholders like <ADMIN_PASSWORD>, <key_id>
  '''CHANGE_ME''',
]

# Public model revisions and tokenizer content hashes are artifact identities.
# Keep the exception bound to these fields AND the evaluation-definition paths;
# Published-site history uses latest/assets instead of docs/assets.
# Credentials in the same YAML files must still be scanned.
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "Public tokenizer revision and SHA-256 in evaluation definitions"
  condition = "AND"
  regexTarget = "match"
  paths = ['''(^|/)(docs|latest)/assets/model-engine-standard/evaluation-profiles/definitions(-vllm|-sglang|-trtllm)?/[^/]+\.yaml$''']
  regexes = [
    '''^"?tokenizerRevision"?:[ \t]*"?[0-9a-f]{40}"?[ \t]*$''',
    '''^"?tokenizerSha256"?:[ \t]*"?[0-9a-f]{64}"?[ \t]*$''',
  ]

  [[rules.allowlists]]
  description = "Public tokenizer SHA-256 in catalog registration metadata"
  condition = "AND"
  regexTarget = "match"
  paths = ['''(^|/)(docs|latest)/assets/model-engine-standard/catalog-registration\.json$''']
  regexes = ['''^"?tokenizerSha256"?:[ \t]*"?[0-9a-f]{64}"?[ \t]*$''']

  [[rules.allowlists]]
  description = "Pinned public tokenizer identities in existing-profile QA inputs"
  condition = "AND"
  regexTarget = "match"
  paths = [
    '''(^|/)(docs|latest)/assets/existing-profiles/(source-definitions|registry-(vllm|sglang|trtllm))/[^/]+\.yaml$''',
    '''(^|/)(docs|latest)/assets/existing-profiles/model-identities\.json$''',
  ]
  regexes = [
    '''^"?tokenizerRevision"?:[ \t]*"?[0-9a-f]{40}"?[ \t]*,?$''',
    '''^"?tokenizerSha256"?:[ \t]*"?[0-9a-f]{64}"?[ \t]*,?$''',
  ]

  [[rules.allowlists]]
  description = "Public tokenizer content hash assignment in existing-profile identity parameters"
  condition = "AND"
  regexTarget = "match"
  paths = ['''(^|/)(docs|latest)/assets/existing-profiles/models/[^/]+\.env$''']
  regexes = ['''^TOKENIZER_SHA=['"]?[0-9a-f]{64}['"]?[ \t]*$''']
